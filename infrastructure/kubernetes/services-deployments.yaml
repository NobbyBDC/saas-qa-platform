# =============================================================================
# Testing Service (needs more resources for browser automation)
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testing-service
  namespace: qa-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: testing-service
  template:
    metadata:
      labels:
        app: testing-service
    spec:
      containers:
        - name: testing-service
          image: ${ECR_REGISTRY}/qa-testing-service:${IMAGE_TAG}
          ports:
            - containerPort: 4003
          envFrom:
            - configMapRef:
                name: qa-platform-config
            - secretRef:
                name: qa-platform-secrets
          env:
            - name: TESTING_SERVICE_PORT
              value: "4003"
          resources:
            requests: { cpu: "1000m", memory: "2Gi" }
            limits: { cpu: "4000m", memory: "6Gi" }
          securityContext:
            capabilities:
              add: ["SYS_ADMIN"]  # Required for Chrome sandbox
---
apiVersion: v1
kind: Service
metadata:
  name: testing-service
  namespace: qa-platform
spec:
  selector:
    app: testing-service
  ports:
    - port: 4003
      targetPort: 4003
---
