# =============================================================================
# QA Platform - Production-like Docker Compose
# Build: docker compose build --parallel   (builds all 7 services in parallel)
# Up:    docker compose up -d
# =============================================================================

x-common-env: &common-env
  NODE_ENV: production
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_pass}
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
  S3_BUCKET: ${S3_BUCKET:-qa-platform}
  S3_PUBLIC_URL: http://localhost:9000/qa-platform
  DATABASE_URL: postgresql://${DB_USERNAME:-qaplatform}:${DB_PASSWORD:-qaplatform_pass}@postgres:5432/${DB_NAME:-qaplatform}

services:
  # -------------------------------------------------------------------------
  # Infrastructure
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: qa-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-qaplatform}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-qaplatform_pass}
      POSTGRES_DB: ${DB_NAME:-qaplatform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-qaplatform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qa-network

  redis:
    image: redis:7-alpine
    container_name: qa-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_pass}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qa-network

  minio:
    image: minio/minio:latest
    container_name: qa-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - qa-network

  # Create default bucket on startup
  minio-init:
    image: minio/mc:latest
    container_name: qa-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing myminio/qa-platform;
      mc anonymous set public myminio/qa-platform;
      exit 0;
      "
    networks:
      - qa-network

  # -------------------------------------------------------------------------
  # OWASP ZAP Security Scanner
  # -------------------------------------------------------------------------
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: qa-zap
    command: zap.sh -daemon -port 8090 -host 0.0.0.0 -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true -config api.key=${ZAP_API_KEY:-zap-key}
    ports:
      - "127.0.0.1:8090:8090"
    networks:
      - qa-network
    volumes:
      - zap_data:/home/zap/.ZAP
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/JSON/core/view/version/?apikey=${ZAP_API_KEY:-zap-key} || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  # -------------------------------------------------------------------------
  # SonarQube Code Quality
  # -------------------------------------------------------------------------
  sonarqube:
    image: sonarqube:community
    container_name: qa-sonarqube
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-qaplatform}
      SONAR_JDBC_USERNAME: ${DB_USERNAME:-qaplatform}
      SONAR_JDBC_PASSWORD: ${DB_PASSWORD:-qaplatform_pass}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    ports:
      - "9002:9000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - qa-network
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # -------------------------------------------------------------------------
  # Application Services
  # -------------------------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: qa-api-gateway
    environment:
      <<: *common-env
      API_GATEWAY_PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-changeme-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-changeme-refresh}
      FIGMA_SERVICE_URL: http://figma-service:4001
      CODEGEN_SERVICE_URL: http://codegen-service:4002
      TESTING_SERVICE_URL: http://testing-service:4003
      SECURITY_SERVICE_URL: http://security-service:4004
      REPORTING_SERVICE_URL: http://reporting-service:4005
      ALLOWED_ORIGINS: http://localhost:3000,https://ai.bdcdev.in
      # Billing (Stripe)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-price_placeholder_pro}
      STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-price_placeholder_enterprise}
      # AI Copilot
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # GitHub Integration
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:4000/api/v1/integrations/github/callback}
      API_BASE_URL: http://api-gateway:4000/api/v1
      # Notifications (SMTP)
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@qaplatform.io}
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - qa-network
    restart: unless-stopped

  figma-service:
    build:
      context: .
      dockerfile: apps/figma-service/Dockerfile
    container_name: qa-figma-service
    environment:
      <<: *common-env
      FIGMA_SERVICE_PORT: 4001
      FIGMA_API_BASE_URL: https://api.figma.com/v1
      FIGMA_WEBHOOK_SECRET: ${FIGMA_WEBHOOK_SECRET:-webhook-secret}
      API_GATEWAY_URL: http://api-gateway:4000
    ports:
      - "4001:4001"
    depends_on:
      - minio
    networks:
      - qa-network
    restart: unless-stopped

  codegen-service:
    build:
      context: .
      dockerfile: apps/codegen-service/Dockerfile
    container_name: qa-codegen-service
    environment:
      <<: *common-env
      CODEGEN_SERVICE_PORT: 4002
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
    ports:
      - "4002:4002"
    networks:
      - qa-network
    restart: unless-stopped

  testing-service:
    build:
      context: .
      dockerfile: apps/testing-service/Dockerfile
    container_name: qa-testing-service
    shm_size: '2gb'  # Required for Chromium
    environment:
      <<: *common-env
      TESTING_SERVICE_PORT: 4003
    ports:
      - "4003:4003"
    depends_on:
      - minio
    networks:
      - qa-network
    restart: unless-stopped

  security-service:
    build:
      context: .
      dockerfile: apps/security-service/Dockerfile
    container_name: qa-security-service
    environment:
      <<: *common-env
      SECURITY_SERVICE_PORT: 4004
      ZAP_API_URL: http://zap:8090
      ZAP_API_KEY: ${ZAP_API_KEY:-zap-key}
      SONAR_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    ports:
      - "4004:4004"
    depends_on:
      zap:
        condition: service_healthy
      sonarqube:
        condition: service_started
    networks:
      - qa-network
    restart: unless-stopped

  reporting-service:
    build:
      context: .
      dockerfile: apps/reporting-service/Dockerfile
    container_name: qa-reporting-service
    environment:
      <<: *common-env
      REPORTING_SERVICE_PORT: 4005
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      JIRA_HOST: ${JIRA_HOST}
      JIRA_EMAIL: ${JIRA_EMAIL}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-QA}
    ports:
      - "4005:4005"
    depends_on:
      - minio
    networks:
      - qa-network
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: qa-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000
      API_GATEWAY_URL: http://api-gateway:4000
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - qa-network
    restart: unless-stopped

  # ── Mailhog (local email trap — no real SMTP needed in dev) ───────────────
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: qa-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI → http://localhost:8025
    networks:
      - qa-network
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Reverse Proxy (Nginx)
  # -------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: qa-nginx
    volumes:
      - ./infrastructure/docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - web
      - api-gateway
    networks:
      - qa-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  zap_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:

networks:
  qa-network:
    driver: bridge
