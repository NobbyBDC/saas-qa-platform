{{- $svcName := "api-gateway" -}}
{{- $cfg := .Values.apiGateway -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qa-platform.fullname" . }}-{{ $svcName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qa-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $svcName }}
spec:
  {{- if not $cfg.autoscaling.enabled }}
  replicas: {{ $cfg.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "qa-platform.selectorLabels" (dict "name" $svcName "root" .) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "qa-platform.selectorLabels" (dict "name" $svcName "root" .) | nindent 8 }}
        app.kubernetes.io/component: {{ $svcName }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "qa-platform.fullname" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $svcName }}
          image: {{ include "qa-platform.image" (dict "repo" $svcName "tag" .Values.images.apiGateway.tag "root" .) }}
          imagePullPolicy: Always
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            {{- range $k, $v := $cfg.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: REDIS_HOST
              value: {{ include "qa-platform.fullname" . }}-redis-master
            - name: REDIS_PORT
              value: "6379"
            {{- if .Values.postgresql.enabled }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $cfg.existingSecret }}
                  key: DATABASE_URL
            {{- end }}
          envFrom:
            {{- include "qa-platform.envFrom" . | nindent 12 }}
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            failureThreshold: 30
            periodSeconds: 5
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "qa-platform.fullname" . }}-{{ $svcName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qa-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $svcName }}
spec:
  type: ClusterIP
  selector:
    {{- include "qa-platform.selectorLabels" (dict "name" $svcName "root" .) | nindent 4 }}
  ports:
    - name: http
      port: 4000
      targetPort: http
      protocol: TCP
---
{{- if $cfg.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "qa-platform.fullname" . }}-{{ $svcName }}
  namespace: {{ .Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "qa-platform.fullname" . }}-{{ $svcName }}
  minReplicas: {{ $cfg.autoscaling.minReplicas }}
  maxReplicas: {{ $cfg.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $cfg.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $cfg.autoscaling.targetMemoryUtilizationPercentage }}
{{- end }}
---
{{- if $cfg.podDisruptionBudget }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "qa-platform.fullname" . }}-{{ $svcName }}
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: {{ $cfg.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "qa-platform.selectorLabels" (dict "name" $svcName "root" .) | nindent 6 }}
{{- end }}
