# =============================================================================
# Figma Service
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: figma-service
  namespace: qa-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: figma-service
  template:
    metadata:
      labels:
        app: figma-service
    spec:
      containers:
        - name: figma-service
          image: ${ECR_REGISTRY}/qa-figma-service:${IMAGE_TAG}
          ports:
            - containerPort: 4001
          envFrom:
            - configMapRef:
                name: qa-platform-config
            - secretRef:
                name: qa-platform-secrets
          env:
            - name: FIGMA_SERVICE_PORT
              value: "4001"
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: figma-service
  namespace: qa-platform
spec:
  selector:
    app: figma-service
  ports:
    - port: 4001
      targetPort: 4001
---
