{{/*
This template documents the expected secret structure.
In production, create the secret out-of-band (e.g. via AWS Secrets Manager + external-secrets-operator)
and set apiGateway.existingSecret to its name.

For local/staging dev you can apply this directly after filling in the values.
*/}}
{{- if .Values.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.apiGateway.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qa-platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | default "postgresql://postgres:postgres@qa-platform-postgresql:5432/qaplatform" | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | default "" | quote }}
  JWT_SECRET: {{ required "secrets.jwtSecret is required" .Values.secrets.jwtSecret | quote }}
  JWT_REFRESH_SECRET: {{ required "secrets.jwtRefreshSecret is required" .Values.secrets.jwtRefreshSecret | quote }}
  STRIPE_SECRET_KEY: {{ .Values.secrets.stripeSecretKey | default "sk_test_placeholder" | quote }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.secrets.stripeWebhookSecret | default "whsec_placeholder" | quote }}
  STRIPE_PRICE_PRO: {{ .Values.secrets.stripePricePro | default "" | quote }}
  STRIPE_PRICE_ENTERPRISE: {{ .Values.secrets.stripePriceEnterprise | default "" | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | default "" | quote }}
  GITHUB_CLIENT_ID: {{ .Values.secrets.githubClientId | default "" | quote }}
  GITHUB_CLIENT_SECRET: {{ .Values.secrets.githubClientSecret | default "" | quote }}
  SMTP_HOST: {{ .Values.secrets.smtpHost | default "" | quote }}
  SMTP_PORT: {{ .Values.secrets.smtpPort | default "587" | quote }}
  SMTP_USER: {{ .Values.secrets.smtpUser | default "" | quote }}
  SMTP_PASS: {{ .Values.secrets.smtpPass | default "" | quote }}
  EMAIL_FROM: {{ .Values.secrets.emailFrom | default "noreply@qaplatform.io" | quote }}
  MINIO_ACCESS_KEY: {{ .Values.secrets.minioAccessKey | default "minioadmin" | quote }}
  MINIO_SECRET_KEY: {{ .Values.secrets.minioSecretKey | default "minioadmin" | quote }}
  S3_BUCKET_REPORTS: {{ .Values.secrets.s3BucketReports | default "qa-platform-reports" | quote }}
  ALLOWED_ORIGINS: {{ .Values.secrets.allowedOrigins | default (printf "https://%s" .Values.ingress.hosts.web) | quote }}
{{- end }}
