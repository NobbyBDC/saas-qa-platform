{{- $svcName := "web" -}}
{{- $cfg := .Values.web -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qa-platform.fullname" . }}-{{ $svcName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qa-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $svcName }}
spec:
  {{- if not $cfg.autoscaling.enabled }}
  replicas: {{ $cfg.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "qa-platform.selectorLabels" (dict "name" $svcName "root" .) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "qa-platform.selectorLabels" (dict "name" $svcName "root" .) | nindent 8 }}
        app.kubernetes.io/component: {{ $svcName }}
    spec:
      serviceAccountName: {{ include "qa-platform.fullname" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $svcName }}
          image: {{ include "qa-platform.image" (dict "repo" $svcName "tag" .Values.images.web.tag "root" .) }}
          imagePullPolicy: Always
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            {{- range $k, $v := $cfg.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: NEXT_PUBLIC_API_URL
              value: "https://{{ .Values.ingress.hosts.api }}"
            - name: NEXTAUTH_URL
              value: "https://{{ .Values.ingress.hosts.web }}"
          envFrom:
            {{- include "qa-platform.envFrom" . | nindent 12 }}
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "qa-platform.fullname" . }}-{{ $svcName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qa-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $svcName }}
spec:
  type: ClusterIP
  selector:
    {{- include "qa-platform.selectorLabels" (dict "name" $svcName "root" .) | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
---
{{- if $cfg.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "qa-platform.fullname" . }}-{{ $svcName }}
  namespace: {{ .Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "qa-platform.fullname" . }}-{{ $svcName }}
  minReplicas: {{ $cfg.autoscaling.minReplicas }}
  maxReplicas: {{ $cfg.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $cfg.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
