# =============================================================================
# Web (Next.js)
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: qa-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ${ECR_REGISTRY}/qa-web:${IMAGE_TAG}
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.your-domain.com"
            - name: NEXT_PUBLIC_WS_URL
              value: "wss://api.your-domain.com"
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1000m", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: qa-platform
spec:
  selector:
    app: web
  ports:
    - port: 3000
      targetPort: 3000
